name: Build DZ Holograma IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build AirLiftFFI transport backend
      run: |
        set -euo pipefail
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim
        cargo build \
          --manifest-path airlift-rust-core/Cargo.toml \
          --release \
          --target aarch64-apple-ios
        cargo build \
          --manifest-path airlift-rust-core/Cargo.toml \
          --release \
          --target aarch64-apple-ios-sim
        test -f airlift-rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a
        test -f airlift-rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a
        rm -rf /tmp/airlift /tmp/AirliftFFI.xcframework
        mkdir -p /tmp/airlift
        cp airlift-rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a /tmp/airlift/
        cp airlift-rust-core/include/airlift.h airlift-rust-core/include/module.modulemap /tmp/airlift/
        xcodebuild -create-xcframework \
          -library airlift-rust-core/target/aarch64-apple-ios/release/libairlift_ffi.a \
          -headers airlift-rust-core/include \
          -library airlift-rust-core/target/aarch64-apple-ios-sim/release/libairlift_ffi.a \
          -headers airlift-rust-core/include \
          -output /tmp/AirliftFFI.xcframework
        cp -R /tmp/AirliftFFI.xcframework /tmp/airlift/

    - name: Add source files to Xcode project
      run: |
        gem install xcodeproj --no-document
        ruby <<'RUBY'
          require "xcodeproj"
          project_path = "DavizinIOS.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == "DavizinIOS" }
          raise "Target not found" unless target

          davizin_group = project.main_group["DavizinIOS"] || project.main_group

          # Collect all .m/.c source files already in the target
          existing = target.source_build_phase.files.map { |f| f.file_ref&.real_path&.to_s }.compact

          # Add .h files as file references (not compile sources) so bridging header finds them
          Dir.glob("DavizinIOS/*.h").sort.each do |file|
            basename = File.basename(file)
            unless davizin_group.files.any? { |f| f.path == basename }
              davizin_group.new_file(basename)
              puts "Added header ref: #{basename}"
            end
          end

          # Add .m/.c/.swift files under DavizinIOS/ to compile sources
          Dir.glob("DavizinIOS/*.{m,c,swift}").sort.each do |file|
            basename = File.basename(file)
            next if davizin_group.files.any? { |f| f.path == basename && target.source_build_phase.files.any? { |bf| bf.file_ref == f } }
            file_ref = davizin_group.files.find { |f| f.path == basename }
            unless file_ref
              file_ref = davizin_group.new_file(basename)
              puts "Added file ref: #{basename}"
            end
            unless target.source_build_phase.files.any? { |bf| bf.file_ref == file_ref }
              target.add_file_references([file_ref])
              puts "Added to target: #{basename}"
            end
          end

          project.save
          puts "Project saved."
        RUBY

    - name: Build
      run: |
        set +e
        xcodebuild \
          -project DavizinIOS.xcodeproj \
          -scheme DavizinIOS \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          ONLY_ACTIVE_ARCH=NO \
          ALWAYS_SEARCH_USER_PATHS=NO \
          BUILD_DIR=/tmp/davizin_build \
          LIBRARY_SEARCH_PATHS=/tmp/airlift \
          FRAMEWORK_SEARCH_PATHS=/tmp/airlift \
          build > /tmp/build.log 2>&1
        status=$?
        set -e

        echo "=== Build completed. Checking for .app ==="
        find /tmp/davizin_build -name "*.app" -type d 2>/dev/null || echo "No .app found"

        echo "=== Checking for errors in log ==="
        grep -i "error:" /tmp/build.log | head -20 || echo "No errors found"
        echo "=== Linker diagnostics ==="
        grep -n -A120 -B20 -E "Undefined symbols|duplicate symbol|ld:|clang: error" /tmp/build.log | tail -180 || true

        if [ "$status" -ne 0 ]; then
          echo "=== Build FAILED (status $status); emitting annotations ==="
          grep -iE "error:|fatal error|undefined symbol" /tmp/build.log | grep -v "^ld: warning" | sort -u | head -30 | while IFS= read -r line; do
            escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error::${escaped}"
          done
          exit "$status"
        fi

    - name: Inject IPA build number into Info.plist
      run: |
        APP=$(find /tmp/davizin_build -name "*.app" -not -path "*/simulator/*" -type d | head -1)
        if [ -z "$APP" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi
        BUILD_NUM="${GITHUB_RUN_NUMBER}"
        echo "Injecting NyxelBuildNumber=${BUILD_NUM} into $APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Delete :NyxelBuildNumber" "$APP/Info.plist" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :NyxelBuildNumber string ${BUILD_NUM}" "$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :NyxelBuildNumber" "$APP/Info.plist"

    - name: Embed entitlements with ldid
      run: |
        brew install ldid
        APP=$(find /tmp/davizin_build -name "*.app" -not -path "*/simulator/*" -type d | head -1)
        if [ -z "$APP" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi
        BINARY="$APP/$(defaults read "$APP/Info.plist" CFBundleExecutable)"
        echo "Embedding entitlements into: $BINARY"
        ldid -SDavizinIOS/DavizinIOS.entitlements "$BINARY"
        echo "Entitlements embedded successfully"

        # Also sign the Network Extension if present
        TUNNEL_APPEX="$APP/PlugIns/ExternalTunnel.appex"
        if [ -d "$TUNNEL_APPEX" ]; then
          TUNNEL_BINARY="$TUNNEL_APPEX/$(defaults read "$TUNNEL_APPEX/Info.plist" CFBundleExecutable)"
          echo "Embedding entitlements into tunnel: $TUNNEL_BINARY"
          ldid -SExternalTunnel/ExternalTunnel.entitlements "$TUNNEL_BINARY"
          echo "Tunnel entitlements embedded"
        fi

    - name: Create IPA
      run: |
        APP=$(find /tmp/davizin_build -name "*.app" -not -path "*/simulator/*" -type d | head -1)
        if [ -z "$APP" ]; then
          echo "ERROR: No .app found"
          exit 1
        fi

        echo "Found app: $APP"
        du -sh "$APP"

        mkdir -p /tmp/Payload
        cp -r "$APP" /tmp/Payload/DavizinIOS.app
        cd /tmp && zip -r "DZ_Holograma_build${GITHUB_RUN_NUMBER}.ipa" Payload/

        ls -lh "/tmp/DZ_Holograma_build${GITHUB_RUN_NUMBER}.ipa"
        unzip -l "/tmp/DZ_Holograma_build${GITHUB_RUN_NUMBER}.ipa" | head -20

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DZ_Holograma_build${{ github.run_number }}
        path: /tmp/DZ_Holograma_build${{ github.run_number }}.ipa
        retention-days: 30
