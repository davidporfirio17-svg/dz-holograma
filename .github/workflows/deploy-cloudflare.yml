name: Deploy DZ Holograma Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: node --check dz.mjs

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: R2 Diagnostic via Worker endpoint
        env:
          DZ_MASTER_PASSWORD: ${{ secrets.DZ_MASTER_PASSWORD }}
        run: |
          echo "=== Waiting 10s for Worker to propagate ==="
          sleep 10
          echo "=== Calling /r2diag endpoint ==="
          curl -sS "https://dz-holograma.davidporfirio17.workers.dev/r2diag?t=${DZ_MASTER_PASSWORD}" | python3 -m json.tool 2>&1 || echo "CURL FAILED (maybe DZ_MASTER_PASSWORD secret not set)"
