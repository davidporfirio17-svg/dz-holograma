name: Deploy DZ Holograma Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: node --check dz.mjs

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Bundle Diagnostic via Worker endpoint
        run: |
          echo "=== Waiting 10s for Worker to propagate ==="
          sleep 10
          echo "=== Calling /bundlediag endpoint ==="
          curl -sS "https://dz-holograma.davidporfirio17.workers.dev/bundlediag" | python3 -m json.tool 2>&1 || echo "BUNDLEDIAG CURL FAILED"
          echo ""
          echo "=== Calling /r2diag endpoint ==="
          curl -sS "https://dz-holograma.davidporfirio17.workers.dev/r2diag" | python3 -m json.tool 2>&1 || echo "R2DIAG CURL FAILED"
          echo ""
          echo "=== Calling /bundlereqlog endpoint ==="
          curl -sS "https://dz-holograma.davidporfirio17.workers.dev/bundlereqlog" | python3 -m json.tool 2>&1 || echo "BUNDLEREQLOG CURL FAILED"
